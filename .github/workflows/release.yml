name: Release
on:
  push:
    tags: ['v*']

# Three jobs so that the OIDC publish capability (id-token: write) is never
# available while third-party code runs: dependency install, tests and the
# build happen in `build` with read-only permissions; `publish` only downloads
# the packed tarball and hands it to npm; `release` only needs contents: write.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.tag }}
      tarball: ${{ steps.meta.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:version
      - run: git diff --exit-code src/version.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:skill-md
      - run: git diff --exit-code skills/
      - run: pnpm build
      - name: Check tag, derive npm dist-tag, pack
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::git tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            # Prerelease (e.g. 1.0.0-alpha.0 / 1.0.0-rc.1) → channel = first identifier after `-`
            CHANNEL=$(printf '%s' "$VERSION" | sed -E 's/^[^-]+-([a-zA-Z]+).*$/\1/')
          else
            CHANNEL=latest
          fi
          TARBALL=$(npm pack --ignore-scripts 2>/dev/null | tail -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL for npm dist-tag '$CHANNEL'"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ steps.meta.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # OIDC trusted publishing: the publisher is registered on npmjs.com under
    # douban-mcp-cli → Settings → Trusted Publisher (jackjin1997/douban-mcp, release.yml).
    # No NPM_TOKEN secret is used; provenance is attached automatically.
    permissions: { id-token: write }
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest && npm --version
      - uses: actions/download-artifact@v4
        with: { name: npm-tarball }
      - name: Publish tarball to npm
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          # npm's OIDC exchange never throws: on failure it logs at verbose level
          # and silently falls back to whatever token is configured. Keep the
          # reason visible in the run log.
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish "./$TARBALL" --tag "$DIST_TAG" --access public --ignore-scripts 2>&1 | grep -v -E 'verb (http|fetch|cache|title|argv|logfile|audit|reify|packumentCache)' ; exit ${PIPESTATUS[0]}

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.dist_tag != 'latest' }}
