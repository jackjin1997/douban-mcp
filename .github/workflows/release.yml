name: Release
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:skill-md
      - run: git diff --exit-code skills/
      - run: pnpm build
      - name: Determine npm dist-tag from package.json version
        id: dist_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            # Prerelease (e.g. 1.0.0-alpha.0 / 1.0.0-rc.1) → channel = first identifier after `-`
            CHANNEL=$(printf '%s' "$VERSION" | sed -E 's/^[^-]+-([a-zA-Z]+).*$/\1/')
          else
            CHANNEL=latest
          fi
          echo "tag=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION to npm dist-tag '$CHANNEL'"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.dist_tag.outputs.tag }}
        run: pnpm publish --tag "$DIST_TAG" --access public --no-git-checks --provenance
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.dist_tag.outputs.tag != 'latest' }}
