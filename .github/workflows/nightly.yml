name: Nightly Smoke
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Anonymous read smoke (real network)
        id: smoke
        continue-on-error: true
        env:
          DOUBAN_DISABLE_CACHE: 'true'
        run: |
          set -euo pipefail
          # One probe per anonymous list page. `jq -e` fails on an {"error":...} object,
          # which a plain `length >= 1` check would let through.
          probe() {
            echo "::group::$*"
            node dist/index.js --json "$@" | tee out.json | head -c 600; echo
            jq -e 'type == "array" and length >= 1' out.json > /dev/null
            echo "::endgroup::"
            sleep 3
          }
          probe search-movie --q "肖申克的救赎" --count 1
          probe search-book  --q "三体" --count 1
          probe movie-chart  --kind top250 --count 1
          probe movie-chart  --kind weekly --count 1
          probe book-chart   --kind fiction --count 1
          probe book-chart   --kind new --count 1
      - name: Open issue on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Nightly smoke failed: HtmlDataSource selectors may have shifted',
              body: 'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['bug', 'parser-rot'],
            });
